<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="gradBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#261A13"/>
      <stop offset="100%" stop-color="#120B07"/>
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D888"/>
      <stop offset="45%" stop-color="#C5A880"/>
      <stop offset="75%" stop-color="#8F6A3C"/>
      <stop offset="100%" stop-color="#DDBA68"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle Corners -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)"/>

  <!-- Concentric Luxury Inset Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldSheen)" stroke-width="4" stroke-opacity="0.65"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4"/>

  <!-- Celestial Diamond Star at Top -->
  <g transform="translate(256, 120)" filter="url(#subtleGlow)">
    <polygon points="0,-24 6,-6 24,0 6,6 0,24 -6,6 -24,0 -6,-6" fill="url(#goldSheen)"/>
    <circle cx="0" cy="0" r="3" fill="#FFF8E7"/>
  </g>

  <!-- Iconic Monogram "A" - Haute Couture Serif Typography -->
  <g filter="url(#subtleGlow)">
    <path d="M 180 380 
             L 214 380 
             L 236 312 
             L 276 312 
             L 298 380 
             L 332 380 
             L 268 184 
             L 244 184 
             Z
             M 243 286 
             L 256 244 
             L 269 286 
             Z" 
          fill="url(#goldSheen)" 
          fill-rule="evenodd"/>
    
    <path d="M 166 380 L 228 380 M 284 380 L 346 380 M 238 184 L 274 184" 
          stroke="url(#goldSheen)" 
          stroke-width="5" 
          stroke-linecap="round"/>

    <line x1="228" y1="312" x2="284" y2="312" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Brand Sub-mark -->
  <text x="256" y="432" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="0.35em" 
        fill="url(#goldSheen)" 
        fill-opacity="0.85">AIZORA</text>
</svg>